# screenhub.900.ca
# ──────────────────────────────────────────────────────────────────────────────
# Nexari Platform nginx config — screenhub.900.ca
# ──────────────────────────────────────────────────────────────────────────────

# ── WebSocket upgrade map ─────────────────────────────────────────────────────
map $http_upgrade $connection_upgrade {
    default   upgrade;
    ''        close;
}

# ── Upstream ──────────────────────────────────────────────────────────────────
upstream signage_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ── Cloudflare real-IP restoration ───────────────────────────────────────────
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header   CF-Connecting-IP;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name screenhub.900.ca;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS — screenhub.900.ca ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name screenhub.900.ca;

    # TLS — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/screenhub.900.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/screenhub.900.ca/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/nexari/apps/ds/dist;
    index index.html;

    client_max_body_size 2g;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'nonce-$request_id' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' wss://screenhub.900.ca https://screenhub.900.ca; frame-ancestors 'self';" always;

    # ── HTML5 package serve ───────────────────────────────────────────────────
    location ~ ^/api/v1/devices/device/content/[^/]+/html5/ {
        proxy_pass         http://signage_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Content-Security-Policy   "frame-ancestors *;" always;
    }

    # ── AI chat — SSE streaming ───────────────────────────────────────────────
    location /api/v1/ai/ {
        proxy_pass         http://signage_api/api/v1/ai/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering    off;
        proxy_cache        off;
        add_header         X-Accel-Buffering "no" always;
        add_header         Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header         X-Content-Type-Options "nosniff" always;
    }

    # ── Screenshot live-view SSE ──────────────────────────────────────────────
    location ~ ^/api/v1/devices/[^/]+/screenshot/stream {
        proxy_pass         http://signage_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
        proxy_cache        off;
        add_header         X-Accel-Buffering "no" always;
        add_header         Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header         X-Content-Type-Options "nosniff" always;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://signage_api/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
    }

    # ── WebSocket — notifications ─────────────────────────────────────────────
    location /api/v1/notifications/ws {
        proxy_pass         http://signage_api/api/v1/notifications/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ── WebSocket — live log tail ─────────────────────────────────────────────
    location /api/v1/logs/tail {
        proxy_pass         http://signage_api/api/v1/logs/tail;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ── WebSocket — device player connections ────────────────────────────────
    location /api/v1/devices/ws/ {
        proxy_pass         http://signage_api/api/v1/devices/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ── WebSocket — sync relay ────────────────────────────────────────────────
    location /api/v1/sync-relay {
        proxy_pass         http://signage_api/api/v1/sync-relay;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ── WebSocket — POS kitchen display ──────────────────────────────────────
    location /api/v1/pos/ws/ {
        proxy_pass         http://signage_api/api/v1/pos/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ── Static file locations ─────────────────────────────────────────────────
    location /uploads/ {
        alias /var/nexari/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /tizen/ {
        alias /var/nexari/tizen/;
        autoindex off;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        types { application/widget wgt; }
        default_type application/octet-stream;
    }

    location /firmware/ {
        alias /var/nexari/player-builds/firmware/;
        autoindex off;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/octet-stream;
    }

    location /android/ {
        alias /var/nexari/android/;
        autoindex off;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        types {
            application/vnd.android.package-archive apk;
            application/json                         json;
        }
        default_type application/octet-stream;
    }

    location /epaper/ {
        alias /var/nexari/epaper/;
        autoindex off;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        types { application/widget wgt; }
        default_type application/octet-stream;
    }

    location /windows/ {
        alias /var/nexari/windows/;
        autoindex off;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/octet-stream;
    }

    location /esp32/ {
        alias /var/nexari/esp32/;
        autoindex off;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        default_type application/octet-stream;
    }

    # Bare-path redirects — Samsung TVs / devices follow these to the right file
    location = /tizen   { return 302 /tizen/sssp_config.xml; }
    location = /epaper  { return 302 /epaper/sssp_config.xml; }
    location = /android { return 302 /android/nexari-android.apk; }
    location = /windows { return 302 /windows/nexari-windows-setup.exe; }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        sub_filter 'nonce="VITE_NONCE"' 'nonce="$request_id"';
        sub_filter_once off;
        try_files $uri $uri/ /index.html;
    }
}

