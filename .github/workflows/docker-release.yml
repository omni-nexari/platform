name: Build and publish Docker image

on:
  push:
    tags:
      - 'v*'           # triggers on v1.0.0, v2.3.1, etc.
  workflow_dispatch:   # allows manual trigger from GitHub Actions UI
    inputs:
      tag:
        description: 'Image tag to publish (e.g. latest, v1.2.3)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: omni-nexari/platform

jobs:
  build-and-push:
    name: Build and push multi-platform image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # tag push: v1.2.3 → 1.2.3 + v1.2.3 + 1.2 + latest
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            # manual dispatch: use input tag
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            # main branch pushes (non-tag): edge
            type=edge,branch=main

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SKIP_PLAYWRIGHT=0

  release-package:
    name: Upload install package to GitHub Release
    runs-on: ubuntu-latest
    # Run on real version tags, or manually when a v* release tag is provided.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v'))
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package docker/ directory
        run: |
          mkdir -p _pkg/nexari
          cp docker/docker-compose.yml \
             docker/nginx.conf.template \
             docker/.env.template \
             docker/generate-keys.sh \
             docker/bootstrap.sh \
             docker/install.sh \
             docker/update.sh \
             _pkg/nexari/
          chmod +x _pkg/nexari/bootstrap.sh _pkg/nexari/generate-keys.sh _pkg/nexari/install.sh _pkg/nexari/update.sh
          tar -czf nexari-install.tar.gz -C _pkg nexari
          cp docker/bootstrap.sh nexari-bootstrap.sh
          chmod +x nexari-bootstrap.sh

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          files: |
            nexari-install.tar.gz
            nexari-bootstrap.sh

  release-standalone:
    name: Build and upload standalone Node.js package
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.event.inputs.tag, 'v'))
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @signage/db     build
          pnpm --filter @signage/shared build
          pnpm --filter @signage/api    build
          pnpm --filter @signage/ds     build

      - name: Obfuscate compiled output
        run: |
          npx --yes javascript-obfuscator@latest \
            apps/api/dist \
            --output apps/api/dist \
            --compact true \
            --identifier-names-generator hexadecimal \
            --rename-globals false \
            --string-array true \
            --string-array-encoding base64 \
            --string-array-threshold 0.75 \
            --control-flow-flattening false \
            --dead-code-injection false \
            --self-defending false \
            --debug-protection false \
            --disable-console-output false

          npx --yes javascript-obfuscator@latest \
            packages/db/dist \
            --output packages/db/dist \
            --compact true \
            --identifier-names-generator hexadecimal \
            --rename-globals false \
            --string-array true \
            --string-array-encoding base64 \
            --string-array-threshold 0.75 \
            --control-flow-flattening false \
            --dead-code-injection false \
            --self-defending false \
            --debug-protection false \
            --disable-console-output false

          npx --yes javascript-obfuscator@latest \
            packages/shared/dist \
            --output packages/shared/dist \
            --compact true \
            --identifier-names-generator hexadecimal \
            --rename-globals false \
            --string-array true \
            --string-array-encoding base64 \
            --string-array-threshold 0.75 \
            --control-flow-flattening false \
            --dead-code-injection false \
            --self-defending false \
            --debug-protection false \
            --disable-console-output false

      - name: Package standalone release
        run: |
          PKG=_standalone/nexari-platform
          mkdir -p "$PKG"

          # Root — workspace manifest + version
          cp package.json pnpm-workspace.yaml "$PKG/"
          cp -r node_modules "$PKG/"

          # DB package
          mkdir -p "$PKG/packages/db"
          cp    packages/db/package.json   "$PKG/packages/db/"
          cp -r packages/db/dist           "$PKG/packages/db/"
          cp -r packages/db/scripts        "$PKG/packages/db/"
          cp -r packages/db/migrations     "$PKG/packages/db/"
          [ -d packages/db/node_modules ] && cp -r packages/db/node_modules "$PKG/packages/db/" || true

          # Shared package
          mkdir -p "$PKG/packages/shared"
          cp    packages/shared/package.json   "$PKG/packages/shared/"
          cp -r packages/shared/dist           "$PKG/packages/shared/"
          [ -d packages/shared/node_modules ] && cp -r packages/shared/node_modules "$PKG/packages/shared/" || true

          # API
          mkdir -p "$PKG/apps/api"
          cp    apps/api/package.json   "$PKG/apps/api/"
          cp -r apps/api/dist           "$PKG/apps/api/"
          [ -d apps/api/node_modules ] && cp -r apps/api/node_modules "$PKG/apps/api/" || true

          # DS static files (served by API)
          mkdir -p "$PKG/apps/ds"
          cp -r apps/ds/dist "$PKG/apps/ds/"

          # Key generator helper
          cp docker/generate-keys.sh "$PKG/"
          chmod +x "$PKG/generate-keys.sh"

          tar -czf nexari-platform.tar.gz -C _standalone nexari-platform

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          files: nexari-platform.tar.gz
